# Builds reSIT for Android (.apk, plus a Play Store .aab when the release key
# is set up), Linux (.deb) and Windows (.exe installer
# and portable .zip).
#
# - Pull requests and manual runs: test, then build all three; the files are
#   attached to the run as artifacts.
# - Every push to main: the same, plus a GitHub Release (tag
#   v<pubspec version>-build.<run number>, e.g. v1.0.0-build.42) with the
#   files attached, created automatically.
# - A version tag you push (e.g. v1.2.0): a release with exactly that
#   version.
#
# Android signing (optional): add these repository secrets to sign the APK
# and build the .aab with your release key (the key lives in keys/, which is
# gitignored). Without them only the APK is built, signed with a debug key,
# which installs fine but can't go to the Play Store.
#   ANDROID_KEYSTORE_BASE64  base64 of the .jks keystore file
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#
# Google Play (optional): every push to main also uploads the .aab to a Play
# testing track when this repository secret is set:
#   PLAY_SERVICE_ACCOUNT_JSON  the JSON key of a Google Cloud service account
#                              invited in Play Console with release rights
# The track is the repository variable PLAY_TRACK (default: internal), and
# the release status PLAY_RELEASE_STATUS (default: completed; use draft while
# the app has never been published on Play).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Flutter version the project is developed and tested with.
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Work out the version
        id: version
        # A tag build uses the tag (v1.2.0 -> 1.2.0). A push to main uses
        # pubspec.yaml's version with the run number (1.0.0-build.42), which
        # becomes its release. Anything else is a dev build (1.0.0-dev.42).
        run: |
          base="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+[:space:]]+).*/\1/')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            version="${base}-build.${GITHUB_RUN_NUMBER}"
          else
            version="${base}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    name: Android (.apk, .aab)
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      # e.g. "1.0.12 (27)": the name and code Play shows for the release.
      play-name: ${{ steps.android-version.outputs.label }}
    env:
      VERSION: ${{ needs.test.outputs.version }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, to count commits below
      - name: Work out the Android version
        id: android-version
        # versionCode = commits on main's first-parent line, minus an offset
        # that lines it up with the Play Store (commit 20 was code 15). Each
        # merge or push to main is one up; Play rejects a code it has seen.
        # versionName is pubspec.yaml's version (bump it there for releases).
        run: |
          code=$(( $(git rev-list --count --first-parent HEAD) - 5 ))
          name="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+[:space:]]+).*/\1/')"
          echo "BUILD_FLAGS=--build-name=$name --build-number=$code" >> "$GITHUB_ENV"
          echo "Android version: $name ($code)"
          echo "label=$name ($code)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Set up release signing
        if: env.KEYSTORE_BASE64 != ''
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # build.gradle.kts signs with key.properties when it exists; the
        # keystore path is relative to android/app.
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter build apk --release $BUILD_FLAGS
      - name: Name the APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/resit-${VERSION}.apk"
      # A debug-signed bundle is useless to the Play Store, so only build it
      # with the release key.
      - name: Build the app bundle
        if: env.KEYSTORE_BASE64 != ''
        run: |
          flutter build appbundle --release $BUILD_FLAGS
          cp build/app/outputs/bundle/release/app-release.aab "dist/resit-${VERSION}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: resit-android
          path: |
            dist/*.apk
            dist/*.aab
          if-no-files-found: error

  linux:
    name: Linux (.deb)
    needs: test
    # Built on the oldest supported Ubuntu so the package also runs on newer
    # ones (it needs the system's GTK and C library to be at least as new).
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build linux --release
      - run: scripts/package_deb.sh "$VERSION" dist
      - uses: actions/upload-artifact@v4
        with:
          name: resit-linux
          path: dist/*.deb
          if-no-files-found: error

  windows:
    name: Windows (.exe)
    needs: test
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      - name: Bundle the Visual C++ runtime
        # Flutter apps need these DLLs; bundling them means the app starts on
        # a PC without the Visual C++ Redistributable installed.
        run: |
          $release = "build\windows\x64\runner\Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:SystemRoot\System32\$dll" $release
          }
      - name: Build the installer
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" scripts\windows_installer.iss
      - name: Zip the portable version
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\resit-$env:VERSION-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: resit-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    # Version tags, and every push to main.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [test, android, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # For a push to main this creates the tag on the commit that was
          # built; for a pushed tag it's that tag.
          tag_name: v${{ needs.test.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: reSIT ${{ needs.test.outputs.version }}
          files: dist/*
          generate_release_notes: true
          make_latest: true

  play:
    name: Google Play (.aab)
    # Pushes to main only: each one has a new versionCode (see the Android
    # job). A tag would rebuild a commit main already uploaded, and Play
    # rejects a versionCode it has seen.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: android
    runs-on: ubuntu-24.04
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check the Play key is set up
        id: check
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON isn't set, so nothing goes to Google Play."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.skip != 'true'
        with:
          name: resit-android
          path: dist
      - name: Find the app bundle
        if: steps.check.outputs.skip != 'true'
        id: aab
        run: |
          aab=$(ls dist/*.aab 2>/dev/null | head -1)
          if [ -z "$aab" ]; then
            echo "::error::No .aab was built. The Android release key secrets (ANDROID_KEYSTORE_*) are needed for one."
            exit 1
          fi
          echo "file=$aab" >> "$GITHUB_OUTPUT"
      - uses: r0adkll/upload-google-play@v1
        if: steps.check.outputs.skip != 'true'
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.fluminaris.resit
          releaseFiles: ${{ steps.aab.outputs.file }}
          releaseName: ${{ needs.android.outputs.play-name }}
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
