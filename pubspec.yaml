name: resit
description: "reSIT: one app for SIT timetable, xSiTe, results and room booking."
publish_to: 'none'

version: 1.0.15+18

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.1
  http: ^1.2.1
  html: ^0.15.4
  go_router: ^14.1.0
  intl: ^0.19.0
  shared_preferences: ^2.5.3
  crypto: ^3.0.8
  url_launcher: ^6.3.3
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1   # ← add this line

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
